<title>MotorSage · Collega la tua AI</title>
<!--
  Pagina di consenso del server OAuth di Supabase: ci arriva chi aggiunge
  MotorSage alla propria AI (Claude, ChatGPT…), con ?authorization_id=…
  Cinque lingue (?lang= oppure quella del browser, altrimenti inglese).

  1. ingresso con email e codice, come nell'app (nessun account nuovo);
  2. nome dell'AI e «Ti collegherai a: <sito>», letti dal server di
     accesso (getAuthorizationDetails); avviso se il sito non è fra quelli
     noti; se il consenso c'è già, prima di tornare all'AI si
     revocano i consensi senza collegamento o scaduti (vedi ripulisciConsensi);
  3. «Collega»: prima collega-assistente, che verifica tutto dal server e
     scrive il collegamento, poi approveAuthorization; «Annulla»:
     denyAuthorization. In tutti e due i casi si segue il redirect_url.
  Veste di MotorSage: marchio e caratteri Manrope stanno sullo stesso sito
  (../../marchio*.png, ../../fonts/), per questo il CSP ammette img-src e
  font-src 'self'.

  La sessione resta solo in memoria: su p3labadmin.github.io pagine di altri
  progetti condividono la stessa origine e quindi lo stesso localStorage.
  Le costanti nello script sono pubbliche per costruzione (la chiave
  «publishable» è già dentro l'app); nessun'altra chiave va in questo file.
  supabase-js arriva da jsDelivr con versione esatta e controllo d'integrità.
  Il CSP ammette solo quel file di jsDelivr (non tutto il sito).
  Ogni testo che viene da fuori (nome dell'AI, sito, email) si scrive
  con textContent, mai come HTML.

  Il CSP qui sopra ammette lo script in linea solo con il suo hash: se si
  modifica lo script, rifare l'hash con
    python3 -c "import hashlib,base64,re,sys;t=open(sys.argv[1]).read();s=re.findall('<scr'+'ipt>(.*?)</scr'+'ipt>',t,re.S)[-1];print(base64.b64encode(hashlib.sha256(s.encode()).digest()).decode())" index.html
  e sostituirlo nel meta. Non si può impedire l'incorniciamento (frame-ancestors
  non vale in un meta): ci pensa il controllo window.top nello script.
-->
<style>

  :root {
    color-scheme: light dark;
    /* --primario riempie (pulsanti, passo attuale), --primario-testo colora le scritte blu */

    :root {
      --primario: #2f6fe0; --primario-testo: #4a8dff; --sfondo: #0e1524; --scheda: #172036; --testo: #eef3fc;
      --testo-2: #b4bfd4; --bordo: #283454; --cerchio: #5b6b8c; --errore: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 32px 16px 48px; background: var(--sfondo); color: var(--testo);
    font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    line-height: 1.5; overflow-wrap: anywhere;
  }
  main { max-width: 440px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  .marchio { display: block; width: 96px; height: auto; margin: 0 auto 12px; }
  h1 { font-size: 1.5rem; margin: 0 0 16px; line-height: 1.25; }
  #passi { list-style: none; margin: 0; padding: 0; display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 14px; font-size: .9rem; color: var(--testo-2); }
  #passi li { display: flex; align-items: center; gap: 6px; }
  #passi li + li::before { content: "·" / ""; margin-right: 8px; }
  #passi .numero {
    display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px;
    border-radius: 50%; border: 1px solid var(--cerchio); font-size: .78rem; font-weight: 700;
  }
  #passi li[aria-current="step"] { color: var(--primario-testo); font-weight: 700; }
  #passi li[aria-current="step"] .numero { border-color: var(--primario); background: var(--primario); color: #fff; }
  .scheda { background: var(--scheda); border: 1px solid var(--bordo); border-radius: 16px; padding: 18px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px; font: inherit; border-radius: 10px;
    border: 1px solid var(--bordo); background: var(--sfondo); color: var(--testo);
  }
  button {
    display: block; width: 100%; min-height: 48px; margin-top: 12px; padding: 13px 16px; border-radius: 14px;
    font: inherit; font-weight: 700; cursor: pointer; border: 1px solid var(--primario);
  }
  button.primario { background: var(--primario); color: #fff; }
  button.secondario { background: transparent; color: var(--primario-testo); border-color: var(--primario-testo); }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--testo); outline-offset: 2px; }
  .nota { color: var(--testo-2); font-size: .93rem; }
  .messaggio { margin: 14px 0 0; font-weight: 600; }
  .messaggio.errore { color: var(--errore); }
  .nome { font-size: 1.15rem; font-weight: 700; }
  .avviso { border: 2px solid var(--errore); border-radius: 12px; padding: 10px 12px; font-weight: 600; color: var(--errore); }
  fieldset { border: 1px solid var(--bordo); border-radius: 12px; margin: 16px 0 0; padding: 10px 12px 12px; }
  legend { font-weight: 700; padding: 0 6px; }
  .livello { display: block; margin: 8px 0 0; font-weight: 400; }
  .livello input { width: auto; margin-right: 8px; }
  .livello.spento { color: var(--testo-2); }
  .livello small { display: block; margin-left: 28px; color: var(--testo-2); }
  .etichetta { font-size: .8rem; font-weight: 700; border: 1px solid var(--bordo); border-radius: 999px; padding: 1px 8px; margin-left: 6px; color: var(--testo-2); }
  [hidden] { display: none !important; }

<main id="pagina">
  <header>
    <picture>
      <source srcset="../../marchio_scuro.png" media="(prefers-color-scheme: dark)">
      <img class="marchio" src="../../marchio.png" alt="MotorSage" width="96" height="73">
    </picture>
    <h1 id="titolo" data-t="titolo">Collega la tua AI a MotorSage</h1>
    <ol id="passi" role="list" data-aria="passi">
      <li id="passo-1"><span class="numero" aria-hidden="true">1</span><span data-t="passoEmail"></span></li>
      <li id="passo-2"><span class="numero" aria-hidden="true">2</span><span data-t="passoCodice"></span></li>
      <li id="passo-3"><span class="numero" aria-hidden="true">3</span><span data-t="passoConferma"></span></li>
    </ol>
  </header>
  <noscript><p>Per collegare la tua AI serve JavaScript. / JavaScript is required.</p></noscript>

  <div class="scheda">
    <form id="modulo-email" hidden>
      <p class="nota" data-t="emailIntro"></p>
      <label for="email" data-t="email"></label>
      <input id="email" type="email" autocomplete="email" required>
      <button class="primario" type="submit" data-t="mandaCodice"></button>
    </form>

    <form id="modulo-codice" hidden>
      <p class="nota"><span data-t="codiceMandato"></span> <strong id="email-mandata"></strong></p>
      <label for="codice" data-t="codice"></label>
      <input id="codice" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6,10}" maxlength="10" required>
      <button class="primario" type="submit" data-t="entra"></button>
      <button class="secondario" type="button" id="altra-email" data-t="altraEmail"></button>
    </form>

    <section id="consenso" hidden>
      <p id="vuole"></p>
      <p><span data-t="sito"></span> <strong id="sito"></strong></p>
      <p data-t="soloSeTuo"></p>
      <p id="sconosciuto" class="avviso" role="alert" data-t="sconosciuto" hidden></p>
      <fieldset>
        <legend data-t="livelli"></legend>
        <!-- I livelli di scrittura non esistono ancora: niente «In arrivo» (F8). -->
        <label class="livello"><input type="radio" name="livello" value="lettura" checked>
          <strong data-t="lettura"></strong>
          <small data-t="letturaDesc"></small></label>
      </fieldset>
      <p class="nota" data-t="privacy"></p>
      <p class="nota"><span data-t="account"></span> <span id="account"></span></p>
      <button class="primario" type="button" id="collega" data-t="collega"></button>
      <button class="secondario" type="button" id="annulla" data-t="annulla"></button>
      <p class="nota" id="solo-lettura"></p>
    </section>

    <p id="messaggio" class="messaggio" role="status" aria-live="polite"></p>
  </div>
</main>

// ---- Lingua: ?lang= oppure quella del browser, altrimenti inglese. ----
function sceltaLingua() {
  const richiesta = (new URLSearchParams(location.search).get('lang') || '').toLowerCase().slice(0, 2);
  if (TESTI[richiesta]) return richiesta;
  const browser = (navigator.language || '').toLowerCase().slice(0, 2);
  return TESTI[browser] ? browser : 'en';
}
const LINGUA = sceltaLingua();
const T = TESTI[LINGUA];

// ---- Regole identiche a quelle del server (supabase/functions/_shared). ----

// _shared/assistenti_noti.ts: solo per mostrare l'avviso prima di «Collega»;
// il server ricalcola `noto` per conto suo.
const RITORNI_NOTI = ['https://claude.ai/api/mcp/auth_callback', 'https://claude.com/api/mcp/auth_callback'];
const HOST_NOTI = ['chatgpt.com', 'chat.openai.com', 'chat.mistral.ai'];
function sitoNoto(uri) {
  let u;
  try { u = new URL(uri); } catch { return false; }
  if (u.protocol !== 'https:' || u.username || u.password) return false;
  const host = u.hostname.toLowerCase().replace(/\.$/, '');
  if (HOST_NOTI.includes(host)) return true;
  return RITORNI_NOTI.includes('https://' + host + (u.port ? ':' + u.port : '') + u.pathname);
}

// _shared/collegamento.ts, nomePulito: testo semplice, senza caratteri di
// controllo, invisibili o di direzione, al massimo 40 caratteri.
function nomePulito(nome) {
  if (typeof nome !== 'string') return '';
  const pulito = nome.replace(/\s+/g, ' ').replace(/[\p{Cc}\p{Cf}]/gu, '').replace(/ {2,}/g, ' ').trim();
  return Array.from(pulito).slice(0, 40).join('').trim();
}

// _shared/collegamento.ts, clientDaRevocare: i consensi senza riga di
// collegamento, o con la riga ferma da più di 90 giorni.
function clientDaRevocare(grants, righe, ora) {
  const limite = ora.getTime() - 90 * 86400000;
  const vive = new Set();
  for (const r of righe) {
    const ultimo = Date.parse(r.ultimo_uso || r.creato_il);
    if (Number.isFinite(ultimo) && ultimo >= limite) vive.add(r.client_id);
  }
  return [...new Set(grants.map((g) => g.clientId))].filter((id) => !vive.has(id));
}

// ---- Pagina ----
const $ = (id) => document.getElementById(id);
const idAutorizzazione = new URLSearchParams(location.search).get('authorization_id') || '';
let db = null;
let email = '';

function messaggio(testo, errore = false) {
  $('messaggio').textContent = testo;
  $('messaggio').classList.toggle('errore', errore);
}

// Schermata mostrata e passo corrente nella riga «1 Email · 2 Codice · 3 Conferma».
const PASSO_DI = { 'modulo-email': 1, 'modulo-codice': 2, consenso: 3 };
function mostra(id) {
  for (const s of ['modulo-email', 'modulo-codice', 'consenso']) $(s).hidden = s !== id;
  for (const n of [1, 2, 3]) {
    const passo = $('passo-' + n);
    if (PASSO_DI[id] === n) passo.setAttribute('aria-current', 'step');
    else passo.removeAttribute('aria-current');
  }
}

function blocca(sì) {
  for (const b of document.querySelectorAll('button')) b.disabled = sì;
}

function traduci() {
  document.documentElement.lang = LINGUA;
  document.title = T.titolo;
  for (const el of document.querySelectorAll('[data-t]')) el.textContent = T[el.dataset.t];
  for (const el of document.querySelectorAll('[data-aria]')) el.setAttribute('aria-label', T[el.dataset.aria]);
}

// Gli schemi pericolosi li rifiuta già il server di accesso quando un client
// si registra; qui si ricontrolla prima di uscire dalla pagina.
async function vaiA(indirizzo) {
  let url;
  try { url = new URL(indirizzo); } catch { url = null; }
  if (!url || ['javascript:', 'data:', 'vbscript:', 'blob:', 'file:', 'about:'].includes(url.protocol)) {
    messaggio(T.rimandoNonValido, true);
    await chiudiSessione();
    return;
  }
  // Prima di uscire la sessione dell'app si chiude: nessun accesso resta vivo
  // in questa pagina.
  await chiudiSessione();
  location.assign(url.href);
}

// Chiude la sessione di questa pagina (solo locale: non tocca gli altri
// dispositivi). Non lancia mai.
async function chiudiSessione() {
  try { if (db) await db.auth.signOut({ scope: 'local' }); } catch (e) { console.error('signOut', e && e.status); }
}

// Il sito a cui si torna, come lo vede una persona: «claude.ai».
function sitoLeggibile(uri) {
  try {
    const u = new URL(uri);
    return u.protocol === 'https:' ? u.host : `${u.protocol}//${u.host}`;
  } catch {
    return uri;
  }
}

// Titolo della pagina: «Collega {nome} a MotorSage» col nome dell'AI già
// ripulito (nomePulito), sempre come testo; senza nome resta quello generico.
function scriviTitolo(nome) {
  const titolo = nome ? T.titoloCon.split('{nome}').join(nome) : T.titolo;
  $('titolo').textContent = titolo;
  document.title = titolo;
}

// «{nome} vuole collegarsi…»: il nome in grassetto, sempre come testo.
function scriviVuole(nome) {
  const p = $('vuole');
  if (!nome) {
    p.textContent = T.vuoleSenzaNome;
    return;
  }
  const [prima, dopo] = T.vuole.split('{nome}');
  p.textContent = prima;
  const n = document.createElement('span');
  n.className = 'nome';
  n.textContent = nome;
  p.append(n, dopo);
}

function avvia() {
  // Dentro la pagina di un altro sito non si mostra e non si fa nulla.
  if (window.top !== window.self) {
    $('pagina').hidden = true;
    return;
  }
  traduci();
  if (!/^[A-Za-z0-9]{8,128}$/.test(idAutorizzazione)) {
    messaggio(T.nonAperta, true);
    return;
  }
  if (!window.supabase) {
    messaggio(T.nonCaricata, true);
    return;
  }
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false },
  });
  mostra('modulo-email');
  messaggio('');
  $('email').focus();
}

$('modulo-email').addEventListener('submit', async (evento) => {
  evento.preventDefault();
  email = $('email').value.trim();
  blocca(true);
  messaggio(T.invio);
  const { error } = await db.auth.signInWithOtp({ email, options: { shouldCreateUser: false } });
  blocca(false);
  if (error) {
    console.error('signInWithOtp', error.status, error.code);
    if (error.status === 429) messaggio(T.troppiTentativi, true);
    else if (['otp_disabled', 'signup_disabled', 'user_not_found'].includes(error.code)) messaggio(T.noAccount, true);
    else messaggio(T.codiceNonInviato, true);
    return;
  }
  $('email-mandata').textContent = email;
  mostra('modulo-codice');
  messaggio('');
  $('codice').focus();
});

$('altra-email').addEventListener('click', () => {
  $('codice').value = '';
  mostra('modulo-email');
  messaggio('');
});

$('modulo-codice').addEventListener('submit', async (evento) => {
  evento.preventDefault();
  blocca(true);
  messaggio(T.controllo);
  const { error } = await db.auth.verifyOtp({ email, token: $('codice').value.trim(), type: 'email' });
  if (error) {
    blocca(false);
    console.error('verifyOtp', error.status, error.code);
    messaggio(error.status === 429 ? T.troppiTentativi : T.codiceSbagliato, true);
    return;
  }
  await caricaDettagli();
  blocca(false);
});

// Il server di accesso approva da solo se c'è già un consenso attivo, e allora
// non rimanda più i dettagli: il collegamento non passerebbe da
// collega-assistente. Prima di tornare all'AI si revocano i consensi
// senza collegamento (scollegati dall'app) o scaduti (90 giorni), con la
// sessione della persona. Restituisce quanti ne ha revocati; lancia se non
// riesce a controllare.
async function ripulisciConsensi() {
  const grants = await db.auth.oauth.listGrants();
  if (grants.error) throw grants.error;
  const righe = await db.from('collegamenti_assistenti').select('client_id, ultimo_uso, creato_il');
  if (righe.error) throw righe.error;
  const da = clientDaRevocare(
    (grants.data || []).map((g) => ({ clientId: g.client.id })),
    righe.data || [],
    new Date(),
  );
  for (const clientId of da) {
    const esito = await db.auth.oauth.revokeGrant({ clientId });
    if (esito.error) throw esito.error;
  }
  return da.length;
}

async function caricaDettagli() {
  messaggio(T.leggo);
  const { data, error } = await db.auth.oauth.getAuthorizationDetails(idAutorizzazione);
  if (error || !data) {
    console.error('getAuthorizationDetails', error && error.status, error && error.code);
    mostra(null);
    messaggio(T.nonValida, true);
    await chiudiSessione();
    return;
  }
  if (!data.authorization_id) {
    let revocati;
    try {
      revocati = await ripulisciConsensi();
    } catch (e) {
      console.error('consensi', e && e.status, e && e.code);
      mostra(null);
      messaggio(T.nonControllato, true);
      await chiudiSessione();
      return;
    }
    mostra(null);
    if (revocati > 0) {
      messaggio(T.rinnovo, true);
      await chiudiSessione();
      return;
    }
    messaggio(T.giaAutorizzato);
    vaiA(data.redirect_url);
    return;
  }
  const nomeAi = nomePulito(data.client && data.client.name);
  // Il nome compare nel titolo solo per i siti noti: per gli altri il titolo
  // resta generico, così un'AI sconosciuta non si presenta con un nome suo.
  const noto = sitoNoto(data.redirect_uri);
  scriviTitolo(noto ? nomeAi : '');
  scriviVuole(nomeAi);
  $('solo-lettura').textContent = nomeAi
    ? T.soloLettura.split('{nome}').join(nomeAi)
    : T.soloLetturaSenzaNome;
  $('sito').textContent = sitoLeggibile(data.redirect_uri);
  $('sconosciuto').hidden = sitoNoto(data.redirect_uri);
  $('account').textContent = (data.user && data.user.email) || email;
  mostra('consenso');
  messaggio('');
}

$('collega').addEventListener('click', async () => {
  blocca(true);
  messaggio(T.collego);
  try {
    const { data: { session } } = await db.auth.getSession();
    const risposta = await fetch(`${SUPABASE_URL}/functions/v1/collega-assistente`, {
      method: 'POST',
      headers: {
        Authorization: `Bearer ${session.access_token}`,
        apikey: SUPABASE_KEY,
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({ authorization_id: idAutorizzazione, lingua: LINGUA }),
    });
    const esito = await risposta.json().catch(() => ({}));
    if (!risposta.ok || !esito.ok) {
      console.error('collega-assistente', risposta.status, esito.errore);
      if (esito.errore === 'ELIMINAZIONE') {
        messaggio(T.eliminazione, true);
        await chiudiSessione();
      } else if (esito.errore === 'DETTAGLI') {
        messaggio(T.nonValida, true);
        await chiudiSessione();
      } else if (esito.errore === 'TROPPI') {
        messaggio(T.troppi, true);
        blocca(false);
      } else {
        messaggio(T.nonCollegato, true);
        blocca(false);
      }
      return;
    }
    const { data, error } = await db.auth.oauth.approveAuthorization(idAutorizzazione, { skipBrowserRedirect: true });
    if (error || !data || !data.redirect_url) {
      console.error('approveAuthorization', error && error.status, error && error.code);
      messaggio(T.nonCompletato, true);
      await chiudiSessione();
      return;
    }
    messaggio(T.fatto);
    vaiA(data.redirect_url);
  } catch (e) {
    console.error('collega', e);
    messaggio(T.nonCollegato, true);
    blocca(false);
  }
});

$('annulla').addEventListener('click', async () => {
  blocca(true);
  messaggio(T.annullo);
  const { data, error } = await db.auth.oauth.denyAuthorization(idAutorizzazione, { skipBrowserRedirect: true });
  if (error || !data || !data.redirect_url) {
    // Non si dice «annullato» se il server non l'ha fatto.
    console.error('denyAuthorization', error && error.status, error && error.code);
    messaggio(T.nonAnnullato, true);
    blocca(false);
    return;
  }
  messaggio(T.annullato);
  vaiA(data.redirect_url);
});

avvia();
</script>
